name: Setmon CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (JAR 생성)
        run: ./gradlew build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/setmon-backend:latest

      - name: EC2로 docker-compose.yml 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: EC2 SSH 접속 및 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            # 1. 최신 이미지 다운로드
            docker compose pull
            
            # 2. 7일 전 수동으로 떠있던 8080 포트 구버전 컨테이너 강제 중지 및 삭제
            docker stop setmon-app || true
            docker rm setmon-app || true
            docker compose down || true
            
            # 3. 최신 이미지 기반으로 강제 재생성 배포
            docker compose up -d --force-recreate --remove-orphans
            
            # 4. 이전 구버전 Docker 이미지 용량 정리
            docker image prune -f