name: Setmon CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (JAR 생성)
        run: ./gradlew build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/setmon-backend:latest

      - name: EC2로 docker-compose.yml 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: EC2 SSH 접속 및 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            
            # 1. docker-compose.yml 존재 여부 확인
            if [ ! -f "docker-compose.yml" ]; then
              echo " Error: docker-compose.yml 파일이 /home/ubuntu/app 경로에 없습니다."
              exit 1
            fi
            
            # 2. Docker 이미지 이름에 사용될 환경변수 설정
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            echo " 최신 Docker 이미지 수동 Pull 중..."
            docker compose pull
            
            echo " 기존 구버전 컨테이너 중지 및 삭제..."
            docker stop setmon-app || true
            docker rm setmon-app || true
            docker compose down || true
            
            echo " 최신 컨테이너 구동..."
            docker compose up -d --remove-orphans
            
            echo " 사용하지 않는 구버전 이미지 정리..."
            docker image prune -f
            
            echo " 최종 컨테이너 상태 확인:"
            docker ps -a