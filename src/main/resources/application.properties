spring.application.name=setmon
spring.config.import=optional:file:.env.local[.properties]

# DB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/setmon?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=PT1H
jwt.refresh-token-validity=P14D

# 스케줄러 (FFmpeg 워커가 매시 알림을 막지 않도록)
spring.task.scheduling.pool.size=4

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
