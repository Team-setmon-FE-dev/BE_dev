plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'

	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

	implementation platform('software.amazon.awssdk:bom:2.31.0')
	implementation 'software.amazon.awssdk:s3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 실행용 jar 하나만 만든다 (*-plain.jar 생성 안 함 → Dockerfile COPY 충돌 방지)
tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}

// 로컬 실행: 환경변수를 JVM 시스템 프로퍼티로 포워딩
bootRun {
	// gradle.properties 의 systemProp.* 값을 Spring 앱 JVM으로 전달
	systemProperties = [
		'spring.datasource.url'      : System.getProperty('DB_URL',            'jdbc:mysql://localhost:3306/setmon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8'),
		'spring.datasource.username' : System.getProperty('DB_USERNAME',       'root'),
		'spring.datasource.password' : System.getProperty('DB_PASSWORD',       'rootpassword'),
		'jwt.secret'                 : System.getProperty('JWT_SECRET',         ''),
		'storage.bucket'             : System.getProperty('S3_BUCKET',          ''),
		'storage.region'             : System.getProperty('AWS_REGION',         'ap-northeast-2'),
		'storage.access-key-id'      : System.getProperty('AWS_ACCESS_KEY_ID',  ''),
		'storage.secret-access-key'  : System.getProperty('AWS_SECRET_ACCESS_KEY', ''),
	]
}
