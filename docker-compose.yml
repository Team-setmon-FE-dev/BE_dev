version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: setmon-db
    restart: always
    environment:
      MYSQL_DATABASE: setmon
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: ${DOCKER_USERNAME}/setmon-backend:latest
    container_name: setmon-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/setmon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      - db
    volumes:
      - /tmp/setmon:/tmp

volumes:
  mysql_data: